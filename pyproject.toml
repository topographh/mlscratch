[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlscratch"
version = "0.1.0"
description = "ML algorithms from scratch in NumPy"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["mlscratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]